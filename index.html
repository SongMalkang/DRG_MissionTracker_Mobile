<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/DRG_MissionTracker_Mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Unofficial DRG mission tracker. Track Double XP missions and Deep Dive info in real time. Not affiliated with Ghost Ship Games.">

  <!-- 캐시 제어: SW(sw.js)가 파일별 캐싱 전략을 관리 -->
  <!-- index.html 자체는 network-first → 배포 시 항상 최신 -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bosco Terminal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bosco Terminal - Unofficial DRG Tracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    PWA 서비스 워커 등록 스크립트.
    커스텀 서비스 워커(sw.js)를 등록하여 PWA 설치 + 웹 알림을 지원한다.
    캐싱은 하지 않으며(실시간 데이터 앱), 알림 표시만 담당.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(registration) {
          console.log('[PWA] SW registered, scope:', registration.scope);
          // 업데이트 감지: 새 버전 설치 시 자동 새로고침
          registration.addEventListener('updatefound', function() {
            var installingWorker = registration.installing;
            if (!installingWorker) return;
            installingWorker.addEventListener('statechange', function() {
              if (installingWorker.state === 'installed' &&
                  navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        }).catch(function(err) {
          console.warn('[PWA] SW registration failed:', err);
        });
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
