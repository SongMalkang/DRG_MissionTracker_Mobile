name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze --fatal-infos

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  build:
    name: Build Check (verification only)
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target: [apk, appbundle, web]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # web 빌드: 커스텀 SW(web/sw.js) 사용, Flutter 기본 캐싱 SW 비활성화
      # sw.js가 정적 에셋 캐싱 + 알림을 담당, __SW_VERSION__은 deploy 시 교체됨
      - run: |
          if [ "${{ matrix.target }}" = "web" ]; then
            flutter build web --release --pwa-strategy=none
          else
            flutter build ${{ matrix.target }} --release
          fi
      # Build verification only. No artifact upload or release.
